<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jian Jiade | Professional Profile</title>
    <style>
        :root {
            --bg-color: #f4f1ea; /* 參考圖的溫和米底色 */
            --card-bg: rgba(255, 255, 255, 0.9);
            --primary-dark: #2c3e50; /* 幹練深藍 */
            --accent-orange: #e67e22; /* 突出的進度條重點色 */
            --text-main: #333333;
            --text-sub: #666666;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: linear-gradient(135deg, #e5e5e5 25%, transparent 25%), 
                              linear-gradient(225deg, #e5e5e5 25%, transparent 25%);
            background-size: 80px 80px; /* 極簡幾何底紋增加層次 */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-card {
            background: var(--card-bg);
            width: 90%;
            max-width: 850px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* 左側欄位：個人基本資訊 */
        .left-panel {
            flex: 1;
            min-width: 300px;
            padding: 40px;
            border-right: 1px solid #eee;
        }

        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 20px;
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .info h1 {
            font-size: 24px;
            margin: 0;
            color: var(--primary-dark);
        }

        .info p {
            font-size: 14px;
            color: var(--accent-orange);
            font-weight: 600;
            margin: 5px 0 0 0;
            text-transform: uppercase;
        }

        .about-section h2 {
            font-size: 18px;
            border-bottom: 2px solid var(--primary-dark);
            display: inline-block;
            margin-bottom: 15px;
        }

        .about-section p {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-sub);
            text-align: justify;
        }

        /* 右側欄位：專業技能與進度條 */
        .right-panel {
            flex: 1;
            min-width: 300px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.5);
        }

        .right-panel h2 {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .skill-item {
            margin-bottom: 20px;
        }

        .skill-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #dfe6e9;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-dark);
            border-radius: 10px;
            transition: width 1s ease-in-out;
        }

        .progress-fill.highlight {
            background: var(--accent-orange);
        }

        /* 社交按鈕 */
        .social-links {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .social-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: var(--primary-dark);
            font-size: 14px;
            transition: 0.3s;
        }

        .social-icon:hover {
            background: var(--primary-dark);
            color: white;
        }

        @media (max-width: 600px) {
            .main-card { flex-direction: column; }
            .left-panel { border-right: none; border-bottom: 1px solid #eee; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="left-panel">
            <div class="profile-header">
                <img src="avatar.jpg" alt="Jian Jiade" class="avatar" onerror="this.src='https://ui-avatars.com/api/?name=Jian+Jiade&background=2c3e50&color=fff'">
                <div class="info">
                    <h1>Jian Jiade</h1>
                    <p>RF & Wireless Strategy</p>
                </div>
            </div>

            <div class="about-section">
                <h2>About me</h2>
                <p>
                    擁有 13 年射頻系統整合實績，橫跨手機研發與車載電子領域。專精於從第一性原理出發，優化複雜的無線通訊架構。目前深耕醫材 CDMO 領域，致力於將頂尖無線技術轉化為可靠的醫療產品。
                </p>
            </div>

            <div class="social-links">
                <a href="https://linkedin.com" class="social-icon">In</a>
                <a href="https://github.com/cm99g" class="social-icon">Gh</a>
                <a href="mailto:your-email@example.com" class="social-icon">@</a>
            </div>
        </div>

        <div class="right-panel">
            <h2>Professional Skills</h2>

            <div class="skill-item">
                <div class="skill-info"><span>RF System Integration</span><span>95%</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width: 95%;"></div></div>
            </div>

            <div class="skill-item">
                <div class="skill-info"><span>Antenna Design & Optimization</span><span>90%</span></div>
                <div class="progress-bar"><div class="progress-fill highlight" style="width: 90%;"></div></div>
            </div>

            <div class="skill-item">
                <div class="skill-info"><span>Automotive Wireless (VDA)</span><span>80%</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width: 80%;"></div></div>
            </div>

            <div class="skill-item">
                <div class="skill-info"><span>Strategic Management</span><span>85%</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width: 85%;"></div></div>
            </div>
        </div>
    </div>

</body>
</html>
