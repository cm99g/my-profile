<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jian Jiade | 個人首頁</title>
    <style>
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #666;
            --bg-color: #ffffff;
            --btn-bg: #f5f5f7;
            --btn-hover: #e8e8ed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        .profile-card {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #f0f0f0;
            margin-bottom: 24px;
            object-fit: cover;
            border: 1px solid #eee;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .title {
            font-size: 16px;
            color: var(--secondary-color);
            margin-bottom: 35px;
            font-weight: 400;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-item {
            display: block;
            padding: 16px;
            background-color: var(--btn-bg);
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .link-item:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
            border: 1px solid #ddd;
        }

        footer {
            margin-top: 50px;
            font-size: 12px;
            color: #bbb;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- 系統會自動讀取你上傳到儲存庫的 avatar.jpg -->
        <img src="avatar.jpg" alt="Jian Jiade" class="avatar" onerror="this.src='https://ui-avatars.com/api/?name=Jian+Jiade&size=120&background=f5f5f7'">
        
        <h1>Jian Jiade</h1>
        <p class="title">RF & Wireless System Integration<br>Professional Professional</p>

        <div class="links">
            <!-- 請在下方 href 引號內填入你真正的連結 -->
            <a href="https://github.com/cm99g" target="_blank" class="link-item">GitHub Projects</a>
            <a href="https://www.linkedin.com" target="_blank" class="link-item">LinkedIn Profile</a>
            <a href="mailto:your-email@example.com" class="link-item">Contact Me</a>
        </div>

        <footer>
            © 2026 JIAN JIADE. All Rights Reserved.
        </footer>
    </div>

</body>
</html>
