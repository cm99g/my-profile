<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jian Jiade | RF & Wireless Strategy</title>
    <style>
        :root {
            --primary: #0a0a0a;
            --accent: #2563eb; /* 科技專業藍 */
            --bg: #ffffff;
            --tag-bg: #f1f5f9;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 60px 20px;
            line-height: 1.6;
        }

        .card {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 2px solid var(--tag-bg);
        }

        h1 {
            font-size: 28px;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .motto {
            font-size: 14px;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 8px 0 24px 0;
        }

        .description {
            font-size: 16px;
            color: var(--text-sub);
            margin-bottom: 24px;
            text-align: left;
        }

        /* 專業技能標籤區 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 32px;
        }

        .tag {
            padding: 6px 12px;
            background: var(--tag-bg);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
        }

        /* 行動按鈕 */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.2s;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .secondary-btn {
            background: white;
            color: var(--primary);
            border: 1px solid #e2e8f0;
        }

        footer {
            margin-top: 60px;
            font-size: 12px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="avatar.jpg" alt="Jian Jiade" class="avatar" onerror="this.src='https://ui-avatars.com/api/?name=Jian+Jiade&background=f1f5f9&color=2563eb'">
        
        <h1>Jian Jiade</h1>
        <div class="motto">First Principles Thinker</div>

        <div class="description">
            擁有超過 13 年射頻系統整合經驗，深耕智慧型手機與車載無線技術研發。目前致力於醫材無線方案與技術策略諮詢，堅持從第一性原理拆解技術難題，為複雜工程提供純粹的解決方案。
        </div>

        <div class="tags">
            <span class="tag">RF System Integration</span>
            <span class="tag">Antenna Design</span>
            <span class="tag">WiFi 7 / 5G</span>
            <span class="tag">Medical IoT</span>
            <span class="tag">Market Strategy</span>
        </div>

        <div class="links">
            <a href="https://linkedin.com" target="_blank" class="link-btn">LinkedIn 專業資歷</a>
            <a href="https://github.com/cm99g" target="_blank" class="link-btn secondary-btn">GitHub 技術專案</a>
            <a href="mailto:your-email@example.com" class="link-btn secondary-btn">Email 商務聯繫</a>
        </div>

        <footer>
            © 2026 Jian Jiade | Yutai Technology
        </footer>
    </div>

</body>
</html>
